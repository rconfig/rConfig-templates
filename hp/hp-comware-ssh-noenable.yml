# rConfig connection template
## Edition: core
## Status: community-tested
## Tested-on: rConfig V6, V7 and V8
## Replaces: H3C-ssh-noenable.yml
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "HP Comware - SSH - No Enable"
  desc: "HP Comware SSH based connection without enable mode. Also covers H3C Comware devices."

connect:
  timeout: 5                              # Connection timeout (in seconds)
  protocol: ssh                           # Protocol: ssh
  port: 22                                # Port number

auth:
  username: "Username:"                   # Username prompt
  password: "Password:"                   # Password prompt
  enable: off                             # Enable mode disabled
  enableCmd: "enable"                     # Enable command (not used)
  enablePassPrmpt: "Password:"            # Enable password prompt (not used)
  hpAnyKeyStatus: off                     # HP-style 'press any key' handling disabled
  hpAnyKeyPrmpt: "Press any key to continue"  # Prompt string if hpAnyKeyStatus is on

config:
  linebreak: "n"                          # Linebreak format (default: 'n')
  paging: on                              # CLI paging enabled
  pagingCmd: "screen-length disable"      # Disable paging command
  resetPagingCmd: "undo screen-length disable"  # Reset paging command
  saveConfig: "wr mem"                    # Save configuration command
  exitCmd: "quit"                         # Exit command
