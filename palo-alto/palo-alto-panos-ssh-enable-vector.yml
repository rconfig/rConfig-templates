# rConfig connection template
## Edition: core
## Status: community-tested
## Tested-on: rConfig V6, V7 and V8
## Replaces: panos-ssh-vector.yml
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "Palo Alto PAN-OS - SSH - Enable - Vector"
  desc: "Palo Alto Networks PAN-OS SSH based connection with scripting mode, vector agent"

connect:
  timeout: 10 # Connection timeout (in seconds)
  protocol: ssh # Protocol: ssh
  port: 22 # Port number

auth:
  username: "login as:" # Username prompt
  password: "Password:" # Password prompt
  enable: on
  enableCmd: "set cli pager off\n set cli config-output-format set\n"
  enablePassPrmpt: "Password:" # Enable password prompt (not used)

config:
  linebreak: ".*"
  paging: on
  pagingCmd: "configure"
  resetPagingCmd: "set cli pager on"
  saveConfig: "quit"
  exitCmd: "quit"
