# rConfig connection template
## Edition: pro
## Status: rconfig-verified
## Tested-on: rConfig V8 Pro
## Docs: https://docs.rconfig.com/integrations/script-integration-engine/sie/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "Script_Template"
  desc: "This is an example script connection template"

connect:
  timeout: 30                             # Connection timeout (in seconds)
  idleTimeout: 30                         # Idle timeout (in seconds)
  protocol: script                        # Protocol type (script for SIE)
  
failure_criteria:
  exit_codes: [1, 2, 255]  # List of exit codes that indicate failure
  error_patterns:           # String patterns in output that indicate failure
    - "Connection refused"
    - "Authentication failed"
    - "ERROR:"
  success_patterns: # ANY of these = success from any scripts attached to the device - optional
    - "Configuration saved"
    - "Second Script Output match"
    - "Third Script Partial Output match"

