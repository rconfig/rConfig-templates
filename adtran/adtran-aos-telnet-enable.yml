# rConfig connection template
## Edition: core
## Status: community-tested
## Tested-on: rConfig V6, V7 and V8
## Replaces: Adtran900_telnet.yml
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "Adtran AOS - TELNET - Enable"                                 # Unique name for this device template
  desc: "Adtran AOS TELNET based connection with enable mode. Tested on Total Access 900 series."                         # Description shown in the rConfig UI

connect:
  timeout: 15                                       # Connection timeout (in seconds)
  protocol: telnet                                  # Connection protocol: 'telnet' or 'ssh'
  port: 23                                          # Port number (range: 1-65535)

auth:
  username: ""                                      # Username prompt - leave blank to skip
  password: "Password:"                             # CLI prompt for password
  enable: on                                        # Enable mode required? Set to 'on' or 'off'
  enableCmd: "enable"                               # Command to enter enable mode
  enablePassPrmpt: "Password:"                      # Prompt shown when enable password is requested
  hpAnyKeyStatus: off                               # For HP-style 'press any key' prompts: 'on' or 'off'
  hpAnyKeyPrmpt: "Press any key to continue"        # Prompt string if hpAnyKeyStatus is on

config:
  linebreak: "n"                                    # Linebreak type: 'n' (default) or 'r'
  paging: off                                       # Set to 'on' to disable CLI paging
  pagingCmd: "terminal length 0"                    # Command to disable paging
  resetPagingCmd: "terminal length 40"              # Optional: Command to re-enable paging
  saveConfig: "wr mem"                              # Command to save running config
  exitCmd: "exit"                                   # Command to end session
