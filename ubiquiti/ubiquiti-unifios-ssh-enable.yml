# rConfig connection template
## Edition: core
## Status: community-tested
## Tested-on: rConfig V6, V7 and V8
## Replaces: unifios-ssh-no-enable.yml
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "Ubiquiti UniFi OS - SSH - Enable"
  desc: "Ubiquiti UniFi OS SSH based connection with enable mode"

connect:
  timeout: 30
  protocol: ssh
  port: 22

auth:
  username: "Username:"
  password: "Password:"
  enable: on
  enableCmd: "enable"
  enablePassPrmpt: "Password:"
  hpAnyKeyStatus: off
  hpAnyKeyPrmpt: "Press any key to continue"

config:
  linebreak: "n"
  paging: on
  pagingCmd: "terminal length 0"
  resetPagingCmd: "terminal length 40"
  saveConfig: "wr mem"
  exitCmd: "quit"
