# rConfig connection template
## Edition: pro
## Status: untested-starter
## Tested-on: rConfig V8
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: 'XFTP Inbound Only - No Outbound Connection' # For devices that push their config into rConfig via xFTP
  desc: 'Marks a device as XFTP-only (inbound). rConfig never connects out to it; config arrives via an xFTP upload and reachability comes from ping.'

connect:
  timeout: 30 # Unused: no outbound connection is ever attempted for this protocol
  # xftp requires an rConfig Pro release newer than 8.3.2. Releases up to 8.3.2 accept only
  # ftp for inbound-only devices.
  protocol: xftp # Inbound-only device: skips SSH/Telnet/script/tl1 outbound connection entirely
  port: 21 # Unused: no outbound connection is ever attempted for this protocol
