# rConfig connection template
## Edition: core
## Status: untested-starter
## Tested-on: not yet tested, please file a template test report
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "
# Requires an rConfig build that reads config.commandLinebreak (RCO-1546). FTOS ignores
# commands terminated with a bare carriage return, so commands are sent with a newline.

main:
  name: "Dell Force10 FTOS - SSH - Enable"
  desc: "Dell Force10 FTOS (Dell Networking OS9) SSH based connection with enable mode"

connect:
  timeout: 60                                         # Connection timeout (in seconds)
  protocol: ssh                                       # Protocol: ssh
  port: 22                                            # Port number

auth:
  username: "Login: "                                 # Username prompt
  password: "Password: "                              # Password prompt
  enable: on                                          # Enable mode enabled
  enableCmd: "enable"                                 # Enable command
  enablePassPrmpt: "Password:"                        # Enable password prompt
  hpAnyKeyStatus: off                                 # HP-style 'press any key' handling
  hpAnyKeyPrmpt: "Press any key to continue"          # Prompt if applicable

config:
  linebreak: "n"                                      # Mandatory, no runtime effect - see commandLinebreak
  commandLinebreak: "n"                               # Send commands ending in a newline - FTOS ignores a bare carriage return
  paging: on                                          # Disable CLI paging with pagingCmd
  pagingCmd: "terminal length 0"                      # Command to disable paging
  resetPagingCmd: "terminal length 40"                # Command to re-enable paging
  saveConfig: "copy running-config startup-config"    # Save config command
  exitCmd: "exit"                                     # Exit command
