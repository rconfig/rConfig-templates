# rConfig connection template
## Edition: core
## Status: untested-starter
## Tested-on: not yet tested, please file a template test report
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "Extreme NOS - SSH - No Enable"
  desc: "Extreme NOS SSH based connection without enable mode"

connect:
  timeout: 60                             # Connection timeout (in seconds)
  protocol: ssh                           # Protocol: ssh
  port: 22                                # Port number

auth:
  username: "username:"                   # Username prompt
  password: "password:"                   # Password prompt
  enable: off                             # Enable mode disabled
  enableCmd: " "                          # Enable command (not used)
  enablePassPrmpt: "password:"            # Enable password prompt (not used)
  hpAnyKeyStatus: off                     # 'Press any key' handling disabled
  hpAnyKeyPrmpt: "Press <SPACE> to continue or <Q> to quit:"  # Custom 'press any key' prompt

config:
  linebreak: "n"                          # Linebreak format (default: 'n')
  paging: on                              # CLI paging enabled
  # Device pager prompt, for reference: "Next page: Space, quit: Q"
  pagingCmd: "terminal length 0"          # Disable paging command
  resetPagingCmd: "terminal no length"    # Reset paging command
  saveConfig: " "                         # Save configuration command
  exitCmd: "quit"                         # Exit command
