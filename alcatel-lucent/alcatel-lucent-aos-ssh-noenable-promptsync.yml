# rConfig connection template
## Edition: pro
## Status: rconfig-verified
## Tested-on: rConfig V8 Pro
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "

main:
  name: "Alcatel-Lucent OMNI Switch - SSH - No Enable"      # Unique template name
  desc: "Alcatel-Lucent OMNI Switch SSH based connection without enable mode"  # Description shown in the rConfig UI

connect:
  timeout: 10                                       # Connection timeout (in seconds)
  protocol: ssh                                     # Connection protocol: 'ssh' or 'telnet'
  port: 22                                          # Port number (range: 1-65535)

auth:
  username: "login :"                               # CLI prompt for username
  password: "password :"                            # CLI prompt for password
  enable: off                                       # Enable mode not required
  enableCmd: "enable"                               # Command to enter enable mode (not used)
  enablePassPrmpt: "Password:"                      # Prompt for enable password (not used)
  hpAnyKeyStatus: off                               # HP-style 'press any key' handling
  hpAnyKeyPrmpt: "Press any key to continue"        # Prompt if applicable

config:
  syncToPromptOnLogin: "on"                         # Pro only, drains the prompt left unread at login
  promptSyncTimeout: 2                              # Pro only, seconds to wait for another prompt during the sync
  linebreak: "n"                                    # Linebreak type: 'n' (default) or 'r'
  paging: off                                       # AOS has no CLI pager by default, nothing to disable
  pagingCmd: ""                                     # Not used, paging is off
  resetPagingCmd: ""                                # Not used, paging is off
  saveConfig: "write memory"                        # Informational, SSH sessions do not send saveConfig, see docs/TEMPLATES.md
  exitCmd: "EXIT"                                   # Command to exit session, case sensitive
