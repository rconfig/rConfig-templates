# rConfig connection template
## Edition: core
## Status: untested-starter
## Tested-on: not yet tested, please file a template test report
## Docs: https://docs.rconfig.com/device-management/connection-templates/
## Community: https://github.com/rconfig/rConfig-templates
## Note: all free-text values must be wrapped in double quotes " "
## Classic CLI paging syntax. For an MD-CLI node use
## nokia-sros-md-ssh-noenable.yml, which uses 'environment more false' instead.

main:
  name: "Nokia SR OS Classic CLI - SSH - No Enable"  # Unique template name
  desc: "Nokia SR OS Classic CLI SSH based connection without enable mode"  # Description shown in the rConfig UI

connect:
  timeout: 30                                       # Connection timeout (in seconds)
  protocol: ssh                                     # Connection protocol: 'ssh' or 'telnet'
  port: 22                                          # Port number (range: 1-65535)

auth:
  username: "Username:"                             # CLI prompt for username
  password: "Password:"                             # CLI prompt for password
  enable: off                                       # Enable mode not required
  enableCmd: "enable"                               # Command to enter enable mode (not used)
  enablePassPrmpt: "Password:"                      # Prompt for enable password (not used)
  hpAnyKeyStatus: off                               # HP-style 'press any key' handling
  hpAnyKeyPrmpt: "Press any key to continue"        # Prompt if applicable

config:
  linebreak: "n"                                    # Linebreak type: 'n' (default) or 'r'
  paging: on                                        # Disable CLI paging
  pagingCmd: "environment no more"                  # Command to disable paging
  resetPagingCmd: "environment more"                # Command to re-enable paging
  saveConfig: "admin save"                          # Informational, SSH sessions do not send saveConfig, see docs/TEMPLATES.md
  exitCmd: "logout"                                 # Command to exit session
